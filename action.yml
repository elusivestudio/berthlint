name: Berthlint
description: Static native mobile release and fastlane metadata validation
inputs:
  path:
    description: Mobile project directory relative to the workspace
    default: "."
  platform:
    description: all, ios, or android
    default: all
  strict:
    description: Fail on warnings as well as errors
    default: "false"
  config:
    description: Optional config path relative to the mobile project
    default: ""
  no-plugins:
    description: Disable configured JavaScript plugins when scanning untrusted code
    default: "true"
  suppressions:
    description: Optional suppressions path relative to the mobile project
    default: ""
  ios-sdk-version:
    description: Declared iOS build SDK version (not the deployment target)
    default: ""
  xcode-version:
    description: Declared Xcode release version
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - name: Install Berthlint
      shell: bash
      run: |
        version="$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")"
        npm install --prefix "$RUNNER_TEMP/berthlint" --no-save --no-package-lock --ignore-scripts "berthlint@$version"
    - name: Validate release
      shell: bash
      env:
        BERTHLINT_PATH: ${{ inputs.path }}
        BERTHLINT_PLATFORM: ${{ inputs.platform }}
        BERTHLINT_STRICT: ${{ inputs.strict }}
        BERTHLINT_CONFIG: ${{ inputs.config }}
        BERTHLINT_NO_PLUGINS: ${{ inputs.no-plugins }}
        BERTHLINT_SUPPRESSIONS: ${{ inputs.suppressions }}
        BERTHLINT_IOS_SDK: ${{ inputs.ios-sdk-version }}
        BERTHLINT_XCODE: ${{ inputs.xcode-version }}
      run: |
        args=("$BERTHLINT_PATH" --format github --platform "$BERTHLINT_PLATFORM")
        if [[ "$BERTHLINT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ -n "$BERTHLINT_CONFIG" ]]; then args+=(--config "$BERTHLINT_CONFIG"); fi
        if [[ "$BERTHLINT_NO_PLUGINS" == "true" ]]; then args+=(--no-plugins); fi
        if [[ -n "$BERTHLINT_SUPPRESSIONS" ]]; then args+=(--suppressions "$BERTHLINT_SUPPRESSIONS"); fi
        if [[ -n "$BERTHLINT_IOS_SDK" ]]; then args+=(--ios-sdk-version "$BERTHLINT_IOS_SDK"); fi
        if [[ -n "$BERTHLINT_XCODE" ]]; then args+=(--xcode-version "$BERTHLINT_XCODE"); fi
        node "$RUNNER_TEMP/berthlint/node_modules/berthlint/dist/cli.js" "${args[@]}"
