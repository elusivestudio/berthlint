name: False positive
description: Report a rule finding that is incorrect for a reproducible input
body:
  - type: markdown
    attributes:
      value: Findings are static review hints, not confirmed store rejections. Please sanitize paths, metadata and source snippets.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ios/usage-descriptions
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Berthlint version or commit and Node version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and finding
      description: Include the command, sanitized config, input snippet and exact finding from JSON output.
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why the finding is incorrect
      description: Explain target ownership, build settings or listing context; include official policy links where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Explain what should still be detected so a fix does not hide genuine findings.
    validations:
      required: true
